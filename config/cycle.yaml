# Supuestos de pronostico del motor de pedido. El ciclo (corte, ventana, llegada) sale de los
# datos y los lotes/RAV4 de config/cycle_rules.yaml.
# Nada se hardcodea en lib/engine. Ver docs/PLAN.md "Supuestos".

lead_time_months: 4 # comunicado de fabrica + ~108 dias reales (94-171)
window_months: [1, 4, 7, 10] # ventanas trimestrales (ene, abr, jul, oct) del comunicado de fabrica

fleet_outlier_min_units: 10 # linea >= 10 unidades de Flota/Institucional se excluye de demanda base

lost_lead_close_rate_source: historical_model_win_rate # tasa de cierre del modelo, no 100%

min_order_effective_threshold_pct: 0.5 # necesidad < 50% del minimo -> pedido 0

# Un mes es de quiebre si su stock al cierre es menor a esta fraccion de la venta mensual
# promedio del modelo (0 si no hay snapshot). La demanda de esos meses se imputa.
stockout_min_stock_fraction: 0.5

# Ventana (meses hasta el corte) de ventas y leads perdidos que reparte la mezcla sugerida por versión.
version_mix_window_months: 12

forecast_weights:
  recent_6m: 0.6
  prior_6m: 0.4

seasonality_min_years: 2 # anios distintos minimos para confiar en un indice estacional por mes

# Meses de historia (ventas e inventario) por debajo de los cuales la importación advierte:
# la estacionalidad pide 2 años y el pronóstico pondera 12 meses.
min_history_months: 24

safety_stock:
  z_high_margin: 1.65
  z_mid_margin: 1.28
  z_low_margin_or_high_fin_cost: 0.84
  margin_high_threshold_pct: 0.12 # margen >= esto -> colchon alto (si el costo financiero no lo penaliza)
  margin_low_threshold_pct: 0.09 # margen <= esto -> colchon bajo
  high_fin_cost_monthly_threshold: 400 # costo financiero mensual/unidad (USD) por encima de esto -> colchon bajo

plan_piso_monthly_pct: 0.009 # 0.9% mensual sobre costo
aging_discounts:
  "180": 0.04
  "270": 0.07
  "365": 0.10

loss_reason_categories:
  - stock
  - price
  - financing
  - competitor
  - postponed
  - no_followup

backtest_cutoffs:
  - "2025-06-30"
  - "2025-09-30"
  - "2025-12-31"
  - "2026-03-31"
